# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# FONTS
font_family      JetBrainsMono Nerd Font
# bold_font        JetBrainsMono Nerd Font Bold
# italic_font      JetBrainsMono Nerd Font Italic
# bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 14.0


disable_ligatures always

# text_composition_strategy platform
# text_composition_strategy legacy
# macos_thicken_font 0

scrollback_lines 100000

scrollback_pager_history_size 100

repaint_delay 10
input_delay 3

sync_to_monitor yes

window_padding_width 2 4


# KEYBINDINGS
map kitty_mod+equal  change_font_size all +1.0   # Ctrl+Shift+= increases font
map kitty_mod+minus  change_font_size all -1.0   # Ctrl+Shift+- decreases font

# # CURSOR TRAIL (animated cursor effect)
# cursor_trail 4                      # Show 4 cursor trail positions
# cursor_trail_start_threshold 0      # Start trail immediately on movement
# cursor_trail_decay 0.1 0.4         # How trail fades (start/end opacity)
# cursor_blink_interval 0.5 ease-in-out  # Cursor blinks every 0.5s with easing
